<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C0370A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />

    <!-- Fallback <title> only: every route sets its own via react-helmet-async
         (see src/components/CanonicalTag.jsx / each page's <Helmet>), which
         properly overwrites document.title, so this is only ever seen for
         the fraction of a second before hydration in local dev.
         Deliberately NOT shipping a static meta description/og:*/twitter:*
         here: react-helmet-async APPENDS tags rather than replacing
         statically-authored ones, so a static <meta name="description"> here
         would coexist with each page's own Helmet-rendered one — two tags
         with the same name, and depending on DOM order, tools reading "the"
         description could read this generic one instead of the page's own.
         That was exactly the "same description on all pages" bug. -->
    <title>Descale Agency | Descale the noise. Scale the signal.</title>
    <meta name="author" content="Descale Agency" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Descale Agency" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://descale.services/og-image.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://descale.services/og-image.svg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical brand asset (above-the-fold logo) -->
    <link rel="preload" as="image" href="/assets/images/descale-logo.png" fetchpriority="high" />

    <!-- Non-blocking font load: print media swap lets the browser parse the page first -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Descale Agency",
        "alternateName": "Descale",
        "legalName": "Travomate Sp. z o.o.",
        "url": "https://descale.services",
        "logo": "https://descale.services/assets/images/descale-logo.png",
        "description": "Marketing systems, IT engineering, and interactive taxi-ad campaigns that compound revenue instead of ad spend. Senior team. EU + US delivery.",
        "foundingLocation": "Warsaw, Poland",
        "taxID": "7011239205",
        "areaServed": ["Poland", "EU", "UK", "US"],
        "sameAs": [
          "https://www.linkedin.com/company/descale-agency/",
          "https://www.instagram.com/descale_services"
        ],
        "knowsAbout": [
          "Brand strategy",
          "Performance marketing",
          "SaaS platform engineering",
          "Web and mobile application development",
          "Product design and design systems",
          "Headless e-commerce",
          "Interactive out-of-home advertising",
          "SEO and Generative Engine Optimization (GEO)"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ul. Nowogrodzka 31",
          "postalCode": "00-511",
          "addressLocality": "Warszawa",
          "addressRegion": "Mazowieckie",
          "addressCountry": "PL"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+48 506 762 423",
          "email": "info@travomate.com.pl",
          "contactType": "sales",
          "availableLanguage": ["English", "Polish", "French", "Spanish"]
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
